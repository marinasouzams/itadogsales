<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport — viewport-fit=cover obrigatório para safe-area em iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Título e descrição -->
    <title>ITADOG SALES</title>
    <meta name="description" content="ITADOG SALES — Sistema de Força de Vendas Acessórios Pet" />
    <meta name="application-name" content="ITADOG SALES" />

    <!-- Theme color — azul escuro do ícone -->
    <meta name="theme-color" content="#082956" />

    <!-- Favicon → icon.png -->
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/icon-512.png" sizes="512x512" />
    <link rel="shortcut icon" href="/icon-192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple / iOS PWA → icon.png -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ITADOG" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="ITADOG SALES" />
    <meta property="og:description" content="Sistema de Força de Vendas Acessórios Pet" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Microsoft -->
    <meta name="msapplication-TileColor" content="#082956" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Limpa Service Workers obsoletos automaticamente para evitar tela branca após deploy -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var updated = false;
          for (var i = 0; i < registrations.length; i++) {
            var sw = registrations[i].active || registrations[i].installing || registrations[i].waiting;
            // Se o SW não for do build atual (sw.js do Workbox), desregistra
            if (sw && sw.scriptURL && !sw.scriptURL.includes('/sw.js')) {
              registrations[i].unregister();
              updated = true;
            }
          }
          // Força recarregamento uma única vez se desregistrou algum SW antigo
          if (updated && !sessionStorage.getItem('sw_cleared')) {
            sessionStorage.setItem('sw_cleared', '1');
            location.reload();
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
